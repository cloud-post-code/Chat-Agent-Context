<!doctype html>
<html lang="en">
<head>
  <title>Dark Sectioned Shop</title>
  <style>
    /* Webflow shape: white body, the real dark-green ground painted
       per-section down the page. */
    body { margin: 0; background: #ffffff; color: #000000; }
    section { width: 100%; }
    .dark { background: #1f2724; height: 900px; }
    .light { background: #efefef; height: 300px; }
  </style>
</head>
<body>
  <section class="dark"><h1>Welcome</h1></section>
  <section class="light"><p>Reviews</p></section>
  <section class="dark"><p>Locations</p></section>
  <section class="dark"><p>Gallery</p></section>
</body>
</html>
