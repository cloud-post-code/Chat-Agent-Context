<!doctype html>
<html lang="en">
<head>
  <title>Harbor Light Bakery</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header>
    <img src="/logo.png" alt="Harbor Light Bakery logo" class="site-logo" width="64" height="64" />
    <nav><a href="/index.html">Home</a></nav>
  </header>
  <div class="hero" aria-label="hero banner"></div>
  <main>
    <h1>Harbor Light Bakery</h1>
    <p>Fresh sourdough on the pier since 2003.</p>
    <a class="btn" href="/index.html">Order ahead</a>
    <img src="/tiny.png" alt="star rating icon" />
    <img srcset="/photo2.jpg 800w" alt="Croissant tray" />
    <section id="gallery"></section>
  </main>
  <script>
    // Real small-business sites render galleries client-side after load;
    // the fixture injects one late so a domcontentloaded-only crawl misses it.
    setTimeout(() => {
      const img = document.createElement("img");
      img.setAttribute("data-src", "/photo1.jpg");
      img.alt = "Morning bake";
      img.src = "/photo1.jpg";
      document.getElementById("gallery").appendChild(img);
    }, 400);
  </script>
</body>
</html>
